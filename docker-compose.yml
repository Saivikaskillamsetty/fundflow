services:
  postgres:
    image: postgres:16
    container_name: fundflow_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundflow
      POSTGRES_PASSWORD: fundflow
      POSTGRES_DB: fundflow
    ports:
      - "5433:5432"
    volumes:
      - fundflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: fundflow_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fundflow_pgdata:
