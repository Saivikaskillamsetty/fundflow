# Fly config for the ingest half only — the BullMQ worker, the Python parser,
# and headless Chrome. The Next.js half lives on Vercel; see DEPLOYMENT.md.
#
# iad puts the worker in the same region as the Neon database. Ingest is
# round-trip bound, so co-locating them is what keeps a monthly sync in minutes
# rather than hours.
app = "fundflow-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  STORAGE_DRIVER = "blob"
  CHROME_PATH = "/usr/bin/chromium"
  PYTHON_BIN = "/opt/parser-venv/bin/python"

# No [http_service]: this app consumes a queue and serves no traffic, so it
# needs no public IP.

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  # Chromium plus a large multi-sheet workbook can spike past 1GB; swap absorbs
  # the peak instead of the OOM killer taking out mid-parse jobs.
  swap_size_mb = 1024
